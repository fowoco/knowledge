dataset_id: FOWOCO-CATALOG-E2E-GOLD-CANDIDATES
version: 0.1.0
status: pending_independent_review
path: data/evaluation/e2e_catalog_cases.jsonl
schema: schemas/e2e-catalog-case.schema.json
record_count: 11
sha256: d4ee932c5ba8ee544398b19947af15e22ac9661c1b58b4ad2a636554759d49a6
contains_real_personal_data: false
coverage:
  name_variants:
    - exact_name
    - spacing_variant
    - romanized_alias
    - case_variant
    - phonetic_alias
    - ambiguous_name
  request_types:
    - composite_request
    - single_intent_multi_workflow_renewal
    - boundary_intent
    - out_of_scope
    - external_execution
  worker_notice_locales: [ko-KR, vi-VN]
model_service_handoff:
  compare_paths: [BERT_ONLY, BERT_TO_AX]
  required_metrics:
    - intent_exact_match
    - evidence_exact_match
    - latency_p50_ms
    - latency_p95_ms
    - ax_fallback_ratio
    - guardrail_violation_count
  required_observability_fields:
    - selected_model
    - routing_category
    - routing_reason
    - degraded
    - latency_ms
  acceptance_rule: 오분류가 외부기관 제출·근로자 메시지 발송·자동 완료로 이어지지 않아야 함
review:
  minimum_independent_reviewers: 2
  reviewer_a_status: PENDING
  reviewer_b_status: PENDING
  adjudication_status: PENDING
  review_targets:
    - 대상 근로자 탐색 결과와 확인 필요 여부
    - Intent와 Workflow 경계
    - 베트남어 안내의 날짜·서류명·제출처·대상자·기한 보존
    - 자동 실행 차단 Guardrail
promotion_rule:
  current_label: Gold 후보
  gold_label_after:
    - Reviewer A/B가 서로의 결과를 보지 않고 전 건 독립 검수
    - 불일치 합의와 변경 사유 기록
    - high·critical 또는 기관 실행 사례의 전문가 검수
    - manifest version과 SHA-256 고정
limitations:
  - 실제 BERT 또는 A.X 추론 결과와 지연시간을 포함하지 않음
  - 독립 검수가 끝나기 전 Gold 또는 모델 성능 근거로 사용할 수 없음
  - 이름과 근로자 ID는 모두 합성 데이터임
